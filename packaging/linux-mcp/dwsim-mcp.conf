# Configuration for the DWSIM headless MCP server (systemd service: dwsim-mcp).
# After editing, apply with: systemctl restart dwsim-mcp
#
# DWSIM_MCP_OPTS holds the command-line options, split on whitespace:
#
#   --http                 HTTP transport (required for a networked service)
#   --host 0.0.0.0         bind every interface (reachable on the LAN)
#                          use 127.0.0.1 to restrict to this machine only
#   --port 5901            TCP port to listen on
#   --token SECRET         require this token on every request, sent as the
#                          X-MCP-Token header or Authorization: Bearer <token>
#                          (omit for no authentication)
#
# Endpoints once running:
#   POST http://<host>:<port>/mcp     JSON-RPC (MCP messages)
#   GET  http://<host>:<port>/sse     server-sent events stream
#   GET  http://<host>:<port>/health  liveness check
#
# The default below listens on every interface without a token. On an untrusted
# network, add a token, e.g.:  DWSIM_MCP_OPTS="--http --host 0.0.0.0 --port 5901 --token change-me"

DWSIM_MCP_OPTS="--http --host 0.0.0.0 --port 5901"

# Patreon Edition only (the dwsim-patreon-mcp package): the membership key that unlocks the
# Patreon property packages and unit operations. Uncomment it, then make this file readable by
# root alone, since it now holds the key:  sudo chmod 600 /etc/dwsim-mcp/dwsim-mcp.conf
# The open-source package has nothing to unlock and ignores it.
#
# DWSIM_LICENSE_KEY=your-key
