name: build

on:
  # Only on a tag and on demand. Running on every push cost real money: the macOS runner alone
  # bills at $0.062 a minute, and a day of ordinary commits came to several dollars of build
  # time for information that a local build already gives.
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      # the spreadsheet is a submodule; without it nothing builds
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DWSIM.slnx

      - name: Build
        run: dotnet build DWSIM.slnx -c Release --no-restore

      # the smoke tests load and solve the sample flowsheets, which is the part that
      # catches a port that compiles and does not run
      - name: Test
        run: dotnet test DWSIM.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 7   # small, but no reason to keep test logs the full 90 days
