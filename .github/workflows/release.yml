name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the packages
        required: true
        default: 10.0.0

env:
  DOTNET_VERSION: '10.0.x'

jobs:

  # dotnet publish -r <rid> does not need a host of that architecture, so the five payloads that
  # do not need signing are all built on the same Linux runner.
  payloads:
    name: publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    env:
      # a token that can read releases of the (proprietary) assistant repo; without it the app is
      # published without the assistant server
      ASSISTANT_TOKEN: ${{ secrets.ASSISTANT_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # aid is the assistant build to bundle: Windows on ARM has none of its own and runs the
        # x64 one through emulation
        include:
          - { rid: win-x64,     debarch: '',    aid: win-x64 }
          - { rid: win-arm64,   debarch: '',    aid: win-x64 }
          - { rid: linux-x64,   debarch: amd64, aid: linux-x64 }
          - { rid: linux-arm64, debarch: arm64, aid: linux-arm64 }
          - { rid: osx-x64,     debarch: '',    aid: osx-x64 }
          - { rid: osx-arm64,   debarch: '',    aid: osx-arm64 }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # -p:CoolPropRid is a global property, so it reaches the CoolPropInterface project reference,
      # which the target RID does not: the SDK builds project references runtime-agnostic, leaving
      # $(RuntimeIdentifier) empty there, so without this the native picked is the runner's (Linux)
      # rather than the one being published for.
      - name: Publish
        run: |
          dotnet publish ui/DWSIM.UI.Desktop.Avalonia/DWSIM.UI.Desktop.Avalonia.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:Version=${{ steps.version.outputs.value }} \
            -p:CoolPropRid=${{ matrix.rid }} \
            -o publish/${{ matrix.rid }}

      # The open-source utility plugins (Natural Gas Properties, Heat of Combustion) are separate
      # net10 assemblies the app loads from plugins/ at runtime. Build each and drop its DLL in;
      # their managed dependencies (FileHelpers) already ship at the publish root.
      - name: Add the utility plugins
        run: |
          dest="publish/${{ matrix.rid }}/plugins"
          mkdir -p "$dest"
          for proj in DWSIM.Plugins.NaturalGas DWSIM.Plugins.HeatOfCombustion; do
            dotnet build "plugins/$proj/$proj.vbproj" -c Release -p:Version=${{ steps.version.outputs.value }}
            cp "plugins/$proj/bin/Release/net10.0/$proj.dll" "$dest/"
          done
          ls -la "$dest"

      # Some native dependencies commit one library per runtime and lean on the build to copy only
      # the matching one; a few leak the others in. A foreign-platform library is dead weight, and
      # on macOS codesign seals the bundle and rejects an unsigned Linux .so as nested code. Keep
      # each platform's own kind: Linux .so on Linux, .dylib on macOS, neither on Windows.
      - name: Strip foreign-platform native libraries
        run: |
          case "${{ matrix.rid }}" in
            linux*) find publish/${{ matrix.rid }} -name '*.dylib' -delete ;;
            osx*)   find publish/${{ matrix.rid }} -name '*.so'    -delete ;;
            win*)   find publish/${{ matrix.rid }} \( -name '*.so' -o -name '*.dylib' \) -delete ;;
          esac
          echo "native libraries kept for ${{ matrix.rid }}:"
          find publish/${{ matrix.rid }} \( -name '*.so' -o -name '*.dylib' -o -iname 'coolprop*.dll' \) -printf '  %P\n' | sort

      # The launcher assembly is already under extenders/ (the application build put it there). Here
      # the separate, proprietary assistant server is fetched from its own repo's latest release and
      # unpacked into extenders/AIAssistantFiles/, where the launcher looks for it. Best-effort: with
      # no token, or no matching asset, the app still ships, just without the assistant server.
      - name: Add the AI Assistant server
        if: env.ASSISTANT_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.ASSISTANT_TOKEN }}
          AID: ${{ matrix.aid }}
        run: |
          dest="publish/${{ matrix.rid }}/extenders/AIAssistantFiles"
          mkdir -p "$dest"

          case "$AID" in
            win-*) asset="dwsim-assistant-$AID.zip" ;;
            *)     asset="dwsim-assistant-$AID.tar.gz" ;;
          esac

          echo "Fetching $asset from DanWBR/dwsim-assistant (latest release)"
          if ! gh release download --repo DanWBR/dwsim-assistant --pattern "$asset" --dir . --clobber; then
            echo "::warning::assistant asset $asset not found; shipping without the assistant server"
            exit 0
          fi

          case "$asset" in
            *.zip)    unzip -qo "$asset" -d "$dest" ;;
            *.tar.gz) tar -xzf "$asset" -C "$dest" ;;
          esac
          rm -f "$asset"
          chmod +x "$dest/dwsim-assistant" 2>/dev/null || true
          ls -la "$dest"

      # Shared distribution content (data, help, samples, User Guide) is published as a release asset
      # so it stays out of git; fetched here and unpacked at the publish root. Best-effort: if the
      # asset is missing the app still ships, just without the bundled documentation and samples.
      - name: Add the distribution content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download content-10.2 --repo DanWBR/dwsim10 --pattern dwsim-content.tar.gz --dir . --clobber; then
            tar -xzf dwsim-content.tar.gz -C publish/${{ matrix.rid }}
            rm -f dwsim-content.tar.gz
            echo "distribution content added"
          else
            echo "::warning::distribution content content-10.2 not found; shipping without data/help/samples/docs"
          fi

      - name: Archive
        run: |
          version=${{ steps.version.outputs.value }}
          mkdir -p artifacts
          case "${{ matrix.rid }}" in
            win-*)
              (cd publish/${{ matrix.rid }} && zip -qr "$GITHUB_WORKSPACE/artifacts/dwsim-$version-${{ matrix.rid }}.zip" .)
              ;;
            *)
              tar -C publish/${{ matrix.rid }} -czf "artifacts/dwsim-$version-${{ matrix.rid }}.tar.gz" .
              ;;
          esac

      - name: Build the .deb
        if: matrix.debarch != ''
        run: |
          chmod +x packaging/linux/build-deb.sh
          packaging/linux/build-deb.sh \
            publish/${{ matrix.rid }} \
            ${{ steps.version.outputs.value }} \
            ${{ matrix.debarch }} \
            artifacts

      # the two macOS payloads travel on to the signing job as they are
      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  # Inno Setup is a Windows tool, so the installer is built on a Windows runner from the already
  # published, self-contained payload. The x64 installer runs on ARM through emulation, but a native
  # arm64 installer is built as well.
  windows-installer:
    name: installer ${{ matrix.rid }}
    needs: payloads
    runs-on: windows-latest
    env:
      # a SignPath API token for a user who submits to the DWSIM_Simulator project; without it the
      # installer is produced unsigned
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      # a direct download URL for the ChemSep Lite installer (lite.exe); without it the installer is
      # built without the optional ChemSep component. Kept out of the repository so a public mirror
      # does not redistribute a third-party binary.
      CHEMSEP_LITE_URL: ${{ secrets.CHEMSEP_LITE_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   arch: x64 }
          - { rid: win-arm64, arch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: payload-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            value=${GITHUB_REF_NAME#v}
          else
            value=${{ inputs.version }}
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          # VersionInfoVersion must be numeric, so drop any -suffix
          echo "verinfo=${value%%-*}" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Fetch the WebView2 bootstrapper
        shell: bash
        run: |
          curl -Lf --retry 3 -o packaging/windows/MicrosoftEdgeWebview2Setup.exe \
            "https://go.microsoft.com/fwlink/p/?LinkId=2124703"

      - name: Fetch ChemSep Lite
        if: env.CHEMSEP_LITE_URL != ''
        shell: bash
        run: |
          curl -Lf --retry 3 -o packaging/windows/lite.exe "$CHEMSEP_LITE_URL" \
            || echo "::warning::ChemSep Lite download failed; the installer will be built without it"

      - name: Build installer
        shell: cmd
        run: >
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.version.outputs.value }}
          /DMyVerInfo=${{ steps.version.outputs.verinfo }}
          /DMyArch=${{ matrix.arch }}
          /DSourceDir=%CD%\publish\${{ matrix.rid }}
          /DOutputDir=%CD%\artifacts
          packaging\windows\dwsim.iss

      # Authenticode signing through SignPath, when configured. The built installer is submitted with
      # the SignPath PowerShell module and the signed one comes back; the private key never leaves
      # SignPath. The identifiers live in repository variables, the API token in a secret. Signing is
      # best-effort: if it is not configured the installer ships unsigned rather than failing.
      - name: Sign installer (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        continue-on-error: true
        shell: pwsh
        run: |
          Install-Module -Name SignPath -Repository PSGallery -Force -Scope CurrentUser -AllowClobber
          $exe = (Get-ChildItem artifacts\*.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force signed | Out-Null
          $out = Join-Path signed (Split-Path $exe -Leaf)
          Submit-SigningRequest `
            -InputArtifactPath  $exe `
            -ApiToken           $env:SIGNPATH_API_TOKEN `
            -OrganizationId     "${{ vars.SIGNPATH_ORGANIZATION_ID }}" `
            -ProjectSlug        "${{ vars.SIGNPATH_PROJECT_SLUG }}" `
            -SigningPolicySlug  "${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}" `
            -OutputArtifactPath $out `
            -WaitForCompletion

      - name: Stage the installer
        shell: bash
        run: |
          mkdir -p dist
          if ls signed/*.exe >/dev/null 2>&1; then
            cp signed/*.exe dist/
          else
            cp artifacts/*.exe dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.rid }}
          path: dist/*.exe
          if-no-files-found: error

  # Bundling, signing, notarising and stapling all need macOS. macos-14 is arm64; the Intel
  # payload is bundled there too, which is fine because nothing here runs it.
  macos:
    name: bundle ${{ matrix.rid }}
    needs: payloads
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: payload-${{ matrix.rid }}
          path: payload

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle
        run: |
          chmod +x packaging/macos/*.sh
          packaging/macos/build-app.sh payload ${{ steps.version.outputs.value }} bundle

      # An empty MACOS_CERTIFICATE only means this repository has no certificate yet: the disk
      # image is still built, and says so in the log.
      - name: Import the certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import certificate.p12 -k build.keychain \
                   -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k runner build.keychain
          rm certificate.p12

      - name: Sign, notarise and package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY_CONTENT: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          if [ -n "$MACOS_NOTARY_KEY_CONTENT" ]; then
            echo "$MACOS_NOTARY_KEY_CONTENT" | base64 --decode > notary.p8
            export MACOS_NOTARY_KEY=$PWD/notary.p8
          fi
          rid=${{ matrix.rid }}
          packaging/macos/sign-and-notarize.sh \
            bundle/DWSIM.app ${{ steps.version.outputs.value }} artifacts "${rid#osx-}"
          rm -f notary.p8

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}-dmg
          path: artifacts/*.dmg
          if-no-files-found: error

  # Two headless packages of the MCP server, for running DWSIM on a mini PC or SBC as a network
  # service. Each .deb installs a systemd unit (dwsim-mcp) listening on a TCP port. Publishing does
  # not need a host of the target architecture, so both are built on the same Linux runner.
  mcp:
    name: mcp server ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   debarch: amd64 }
          - { rid: linux-arm64, debarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the MCP server
        run: |
          dotnet publish tools/DWSIM.MCPServer/DWSIM.MCPServer.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:Version=${{ steps.version.outputs.value }} \
            -p:CoolPropRid=${{ matrix.rid }} \
            -o publish-mcp/${{ matrix.rid }}

      - name: Strip foreign-platform native libraries
        run: |
          find publish-mcp/${{ matrix.rid }} -name '*.dylib' -delete
          echo "native libraries kept for ${{ matrix.rid }}:"
          find publish-mcp/${{ matrix.rid }} \( -name '*.so' -o -iname 'coolprop*' \) -printf '  %P\n' | sort

      - name: Build the .deb
        run: |
          chmod +x packaging/linux-mcp/build-mcp-deb.sh
          packaging/linux-mcp/build-mcp-deb.sh \
            publish-mcp/${{ matrix.rid }} \
            ${{ steps.version.outputs.value }} \
            ${{ matrix.debarch }} \
            artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: package-mcp-${{ matrix.rid }}
          path: artifacts

  # Multi-architecture container image of the headless MCP server, for running DWSIM as a network
  # service in Docker on a PC or SBC. Pushed to GitHub Container Registry on a tag; a
  # workflow_dispatch run builds both architectures to validate the image without pushing.
  # GHCR authenticates with the built-in GITHUB_TOKEN, so no extra secret is needed.
  docker:
    name: mcp docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v=${GITHUB_REF_NAME#v}
          else
            v=${{ inputs.version }}
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"

      - name: Publish both architectures into the build context
        run: |
          mkdir -p docker-build
          cp packaging/docker/Dockerfile docker-build/
          for pair in linux-x64:amd64 linux-arm64:arm64; do
            rid=${pair%%:*}; arch=${pair##*:}
            dotnet publish tools/DWSIM.MCPServer/DWSIM.MCPServer.csproj \
              -c Release -r "$rid" --self-contained true \
              -p:Version=${{ steps.version.outputs.value }} \
              -p:CoolPropRid="$rid" \
              -o "docker-build/publish-mcp/$arch"
            find "docker-build/publish-mcp/$arch" -name '*.dylib' -delete
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker-build
          file: docker-build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/danwbr/dwsim-mcp:${{ steps.version.outputs.value }}
            ghcr.io/danwbr/dwsim-mcp:${{ steps.version.outputs.minor }}
            ghcr.io/danwbr/dwsim-mcp:latest

  release:
    name: draft the release
    needs: [payloads, macos, mcp]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: packages
          merge-multiple: true

      - name: Build the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          describe() {
            case "$1" in
              *win-x64-setup.exe)   echo "Windows x64 - installer";;
              *win-arm64-setup.exe) echo "Windows ARM64 - installer";;
              *win-x64.zip)         echo "Windows x64 - portable (zip)";;
              *win-arm64.zip)       echo "Windows ARM64 - portable (zip)";;
              *osx-x64.tar.gz)      echo "macOS (Intel) - portable (tar.gz)";;
              *osx-arm64.tar.gz)    echo "macOS (Apple Silicon) - portable (tar.gz)";;
              *arm64.dmg)           echo "macOS (Apple Silicon) - disk image";;
              *x64.dmg)             echo "macOS (Intel) - disk image";;
              *mcp*amd64.deb)       echo "MCP server (headless) - Linux x64, Debian/Ubuntu";;
              *mcp*arm64.deb)       echo "MCP server (headless) - Linux ARM64, Debian/Ubuntu";;
              *amd64.deb)           echo "Linux x64 - Debian/Ubuntu package";;
              *arm64.deb)           echo "Linux ARM64 - Debian/Ubuntu package";;
              *linux-x64.tar.gz)    echo "Linux x64 - portable (tar.gz)";;
              *linux-arm64.tar.gz)  echo "Linux ARM64 - portable (tar.gz)";;
              *)                    echo "";;
            esac
          }
          # What's new = the user-facing commits since the previous release tag
          REPO="$GITHUB_REPOSITORY"; CUR="$GITHUB_REF_NAME"
          tags=$(gh api "repos/$REPO/tags" --paginate -q '.[].name' 2>/dev/null | grep -E '^v[0-9]' || true)
          prev=$( { printf '%s\n' "$tags"; echo "$CUR"; } | sort -uV | grep -B1 -Fx "$CUR" | head -n1 )
          changes=""
          if [ -n "$prev" ] && [ "$prev" != "$CUR" ]; then
            msgs=$(gh api "repos/$REPO/compare/$prev...$CUR" -q '.commits[].commit.message | split("\n")[0]' 2>/dev/null || true)
            changes=$(printf '%s\n' "$msgs" | grep -E '^(feat|fix|perf)(\(.+\))?!?: ' | sed -E 's/^(feat|fix|perf)(\(.+\))?!?: //' | sed 's/^/- /')
            [ -z "$changes" ] && changes=$(printf '%s\n' "$msgs" | grep -viE '^(Merge |chore|ci|build|docs|test|style|refactor)' | grep -v '^$' | sed 's/^/- /')
          fi
          {
            echo "## What's new in this release"
            echo
            if [ -n "$changes" ]; then echo "$changes"; else echo "- See the full changelog link below for the complete list of changes."; fi
            echo
            echo "## System requirements"
            echo
            echo "**Desktop application** (self-contained, no .NET runtime installation required):"
            echo "- Windows 10 or later (x64 or ARM64)"
            echo "- Linux, a recent 64-bit distribution such as Ubuntu 22.04 or later (x64 or ARM64)"
            echo "- macOS 12 or later (Intel or Apple Silicon)"
            echo "- 4 GB RAM recommended, about 1 GB of free disk space"
            echo "- No dedicated GPU required"
            echo
            echo '**Headless MCP server** (`.deb`): Debian or Ubuntu (x64 or ARM64), no graphical environment required.'
            echo
            echo "### Downloads"
            echo
            echo "| File | Platform |"
            echo "|---|---|"
            for f in packages/*; do
              [ -f "$f" ] || continue
              n=$(basename "$f")
              printf '| \x60%s\x60 | %s |\n' "$n" "$(describe "$n")"
            done
          } > release-body.md
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: packages/*
          generate_release_notes: true
          body_path: release-body.md
