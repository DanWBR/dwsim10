name: build-linux-fixed

# 只构建 Linux x64 自包含产物，用于验证/部署本地修改。
# 触发方式：
#   1. 推送 fix-settings-load 分支时自动触发
#   2. 仓库 Actions 页面手动 "Run workflow"

on:
  push:
    branches: ['fix-settings-load']
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  publish-linux-x64:
    name: publish linux-x64 (self-contained)
    runs-on: ubuntu-latest

    steps:
      # ReoGrid 是子模块，不带它编译不过
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 与 release.yml 的 payloads job 相同的发布命令。
      # -p:CoolPropRid 让 CoolPropInterface 项目引用到正确的原生库
      - name: Publish the application
        run: |
          dotnet publish ui/DWSIM.UI.Desktop.Avalonia/DWSIM.UI.Desktop.Avalonia.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:CoolPropRid=linux-x64 \
            -o publish/linux-x64

      # 开源工具插件（Natural Gas Properties、Heat of Combustion）是独立程序集，
      # 运行时从 plugins/ 目录加载，需要单独构建放进去
      - name: Add the utility plugins
        run: |
          dest="publish/linux-x64/plugins"
          mkdir -p "$dest"
          for proj in DWSIM.Plugins.NaturalGas DWSIM.Plugins.HeatOfCombustion; do
            dotnet build "plugins/$proj/$proj.vbproj" -c Release
            cp "plugins/$proj/bin/Release/net10.0/$proj.dll" "$dest/"
          done
          ls -la "$dest"

      # 发布产物里可能混入其他平台的原生库，清掉
      - name: Strip foreign-platform native libraries
        run: |
          find publish/linux-x64 -name '*.dylib' -delete
          echo "保留的原生库："
          find publish/linux-x64 \( -name '*.so' -o -iname 'coolprop*' \) -printf '  %P\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: dwsim-linux-x64-fixed
          path: publish/linux-x64
          if-no-files-found: error
